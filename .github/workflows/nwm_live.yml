# Hourly NWM short-range archiver. Data lives on the orphan branch `nwm-archive` (keeps main small); no secrets needed.
name: nwm-live
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: nwm-live, cancel-in-progress: false}
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # first run downloads 72 cycles x 18 leads; steady state takes a few minutes
    steps:
      - uses: actions/checkout@v4
      - name: restore archive branch into data/forecasts
        run: |
          if git ls-remote --exit-code origin nwm-archive >/dev/null 2>&1; then
            git fetch origin nwm-archive && git worktree add data/forecasts FETCH_HEAD && git -C data/forecasts checkout -B nwm-archive
          else
            git worktree add --orphan -b nwm-archive data/forecasts
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - name: archive last 72 h (idempotent)
        run: python -u src/nwm_backfill.py 72 | tee run.log
      - name: fail loudly if nothing was fetched
        run: |
          n=$(grep -cE ' (ok|partial)$' run.log || true)
          echo "new cycles fetched: $n"
          echo "--- manifest tail ---"; tail -n 15 data/forecasts/manifest.csv || true
          [ "$n" -gt 0 ] || { echo "::error::zero cycles fetched in this run"; exit 1; }
      - name: commit
        working-directory: data/forecasts
        run: |
          git config user.name nwm-bot && git config user.email nwm-bot@users.noreply.github.com
          git add -A && (git diff --cached --quiet || git commit -m "nwm cycles $(date -u +%FT%HZ)") && git push origin nwm-archive
